<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ｜きたむらミュージックスクール</title>
    <meta name="description" content="「きたむらミュージックスクール」のお問い合わせページです。">
    <link rel="icon" href="./img/main-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="page-contact">
  <div id="container">

    <header class="header">
      <div class="l-header">
        <div class="l_inner p-header">
          <div class="p-header__logo">
            <a href="./index.html" class="p-header__main-logo">
              <span class="p-header__main-logo-image">
                <img src="./img/main-logo.svg" alt="きたむらミュージックスクールのロゴ">
              </span>
              <span class="p-header__main-logo-textarea">
                <span class="p-header__main-logo-name">きたむら</span>
                <span class="p-header__main-logo-school">ミュージックスクール</span>
              </span>
            </a>
          </div>

          <!-- ヘッダーナビ -->
          <nav class="l-header__nav" aria-label="ヘッダーナビゲーション">
            <ul>
              <li>
                <a href="plan.html">料金</a>  
              </li>
              <li>
                <a href="blog-list.html">ブログ</a>  
              </li>
              <li>
                <a href="result-list.html">卒業実績</a>  
              </li>
            </ul>
            <a href="contact-form.html" class="p-header__contact">お問い合わせ</a>
          </nav>
        </div>

        <!-- ハンバーガーボタン -->
        <button class="hamburger" id="js-hamburger">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main>
      <div class="main">

        <!-- fv -->
        <section class="p-contact-form-fv">
          <div class="p-contact-form-fv__bg-image">
            <picture>
              <source media="(max-width: 767px)" srcset="./img/contact-sp.jpg">
              <img src="./img/contact.jpg" alt="PCとヘッドホンの画像">
            </picture>
          </div>
          <div class="p-contact-form-fv__contents">
            <h1>お問い合わせ</h1>
          </div>
        </section>

        <!-- パンくずリスト -->
        <div class="c-breadcrumb">
          <div class="l_inner">
            <a href="index.html">ホーム</a>
            <span class="c-breadcrumb__separator">&gt;</span>
            <span>お問い合わせ</span>
          </div>
        </div>

        <section id="p-contact-form" class="p-contact-form">
          <div class="l_inner">
            <div class="p-contact-form__text">
              <h2>当校に関するご質問・ご相談・資料請求は下記のフォームからお気軽にお問い合わせください。<br>通常３営業日以内にメールにてご連絡させていただきます。</h2>
            </div>
            <div class="p-contact-form__contents">
              <form method="post">

                <!-- 会社名 -->
                <dl class="p-contact-form__area p-contact-form__area-name">
                  <dt>
                    <label for="your-company">会社名</label>
                  </dt>
                  <dd>
                    <input type="text" name="your-company" placeholder="きたむらミュージックスクール" id="your-company" class="form-control">
                  </dd>
                </dl>
                
                <!-- お名前 -->
                <dl class="p-contact-form__area p-contact-form__area-name">
                  <dt>
                    <label for="your-name">お名前</label>
                  </dt>
                  <dd>
                    <input type="text" name="your-name" placeholder="北村　翔平" id="your-name" class="form-control">
                  </dd>
                </dl>
                
                <!-- メールアドレス -->
                <dl class="p-contact-form__area p-contact-form__area-name">
                  <dt>
                    <label for="your-email">メールアドレス</label>
                  </dt>
                  <dd>
                    <input type="email" name="your-email" placeholder="info@kitamura.musicschool.jp" id="your-email" class="form-control">
                  </dd>
                </dl>
                
                <!-- 電話番号 -->
                <dl class="p-contact-form__area p-contact-form__area-name">
                  <dt>
                    <label for="your-tel">電話番号</label>
                  </dt>
                  <dd>
                    <input type="tel" name="your-tel" placeholder="090-1234-5678" id="your-tel" class="form-control">
                  </dd>
                </dl>

                <!-- チェックボックス -->
                <dl class="p-contact-form__checkbox">
                  <dt>目　的　<br class="pc">(複数選択可)</dt>
                  <dd>
                    <div class="checkbox__label">
                      <label>
                        <input type="checkbox" name="source[]" value="plan">
                        <span>プランについてのお問い合わせ</span>
                      </label>
                    </div>
                    <div class="checkbox__label">
                      <label>
                        <input type="checkbox" name="source[]" value="consultation-booking">
                        <span>ヒアリングのご予約</span>
                      </label>
                    </div>
                    <div class="checkbox__label">
                      <label>
                        <input type="checkbox" name="source[]" value="request-information">
                        <span>資料請求</span>
                      </label>
                    </div>
                    <div class="checkbox__label">
                      <label>
                        <input type="checkbox" name="source[]" value="other">
                        <span>その他</span>
                      </label>
                    </div>
                  </dd>
                </dl>

                <!-- 内容 -->
                <dl class="p-contact-form__message-area">
                  <dt>
                    <label for="your-textarea">内　容</label>
                  </dt>
                  <dd>
                    <textarea name="your-textarea" placeholder="内容に関する詳細や備考等をご入力ください。" id="your-textarea"></textarea>
                  </dd>
                </dl>

                <!-- 送信ボタン -->
                <div class="p-contact-form__submit-area">
                  <button type="button" onclick="window.location.href = 'contact_send.html'">送 信</button>
                </div>
              </form>

            </div>
          </div>
        </section>
        
        <!-- ページトップへ戻るボタン -->
        <div class="p-fixed-buttons">
          <a href="#top" class="p-fixed-buttons__top">
            <img src="./img/top-button.svg" alt="ページトップへ戻るボタン">
          </a>
        </div>
      </div>
    </main>

    <!-- footer -->
    <footer>
      <div class="footer">
        <div class="footer__menu">
          <ul class="footer__nav">
            <li>
              <a href="index.html">ホーム</a>  
            </li>
            <li>
              <a href="plan.html">料金</a>  
            </li>
            <li>
              <a href="blog-list.html">ブログ</a>  
            </li>
            <li>
              <a href="result-list.html">卒業実績</a>  
            </li>
          </ul>
        </div>
        <div class="footer__logo">
          <a href="index.html">
            <img src="./img/logo-white.svg" alt="Logo">
          </a>
        </div>
        <div class="footer__copyright">
          <p>Copyright © 0000 KITAMURA music school Inc. <br class="sp">All Rights</p>
        </div>
        <div class="footer__sns">
          <ul>
            <li>
              <a href="" target="_blank" rel="noopener noreferrer">
                <div class="sns-link">
                  <img src="./img/icon-twitter.svg" alt="twitter">
                </div>
              </a>
            </li>
            <li>
              <a href="" target="_blank" rel="noopener noreferrer">
                <div class="sns-link">
                  <img src="./img/icon-facebook.svg" alt="facebook">
                </div>
              </a>
            </li>
            <li>
              <a href="" target="_blank" rel="noopener noreferrer">
                <div class="sns-link">
                  <img src="./img/icon-youtube.svg" alt="youtube">
                </div>
              </a>
            </li>
            <li>
              <a href="" target="_blank" rel="noopener noreferrer">
                <div class="sns-link">
                  <img src="./img/icon-instagram.svg" alt="instagram">
                </div>
              </a>
            </li>
          </ul>
        </div>

      </div>
    </footer>

  </div>
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
